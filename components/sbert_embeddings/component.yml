$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: sbert_embeddings
display_name: SBERT Embeddings
type: command

inputs:
  train:
    type: uri_folder
  val:
    type: uri_folder
  test:
    type: uri_folder
  deploy:
    type: uri_folder
  dims:
    type: integer
    default: 32

outputs:
  train_out:
    type: uri_folder
  val_out:
    type: uri_folder
  test_out:
    type: uri_folder
  deploy_out:
    type: uri_folder

code: .
command: >
  python sbert.py
  --train ${{inputs.train}}
  --val ${{inputs.val}}
  --test ${{inputs.test}}
  --deploy ${{inputs.deploy}}
  --dims ${{inputs.dims}}
  --train_out ${{outputs.train_out}}
  --val_out ${{outputs.val_out}}
  --test_out ${{outputs.test_out}}
  --deploy_out ${{outputs.deploy_out}}

environment: azureml:sbert-env:1
